<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockys Rescue Ranch — Great Dane Rescue, North Texas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --barn: #A8322C; --wood: #7A4F2D; --cream: #F5EFE0; --slate: #2E2D32;
      --blue-dane: #5A5862; --gold: #C8952A; --white: #FFFFFF; --light: #F9F6F0;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Source Sans 3', sans-serif; background: var(--light); color: var(--slate); line-height: 1.6; }

    nav { background: var(--slate); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .nav-logo img { height: 46px; width: 46px; object-fit: contain; background: var(--cream); border-radius: 50%; padding: 3px; }
    .nav-logo span { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.1rem; color: var(--cream); line-height: 1.2; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: var(--cream); text-decoration: none; font-weight: 500; font-size: 0.95rem; letter-spacing: 0.03em; opacity: 0.85; transition: opacity 0.2s; }
    .nav-links a:hover { opacity: 1; }
    .nav-links a.cta { background: var(--barn); color: white; padding: 0.4rem 1.1rem; border-radius: 4px; opacity: 1; font-weight: 600; }
    .nav-links a.cta:hover { background: #8c2622; }

    .hero { background: var(--slate); display: grid; grid-template-columns: 1fr 1fr; min-height: 560px; }
    .hero-text { padding: 5rem 3rem 5rem 4rem; display: flex; flex-direction: column; justify-content: center; }
    .hero-eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
    .hero-headline { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 4vw, 3.6rem); font-weight: 900; color: var(--white); line-height: 1.1; margin-bottom: 1.25rem; }
    .hero-headline em { color: var(--barn); font-style: normal; }
    .hero-sub { font-size: 1.05rem; color: rgba(245,239,224,0.85); max-width: 440px; margin-bottom: 2rem; line-height: 1.7; }
    .hero-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 0.75rem 1.75rem; border-radius: 4px; font-weight: 600; font-size: 1rem; text-decoration: none; transition: background 0.2s, transform 0.15s; cursor: pointer; border: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--barn); color: white; }
    .btn-primary:hover { background: #8c2622; }
    .btn-outline { background: transparent; color: var(--cream); border: 2px solid rgba(245,239,224,0.5); }
    .btn-outline:hover { border-color: var(--cream); }
    .btn-gold { background: var(--gold); color: var(--slate); }
    .btn-gold:hover { background: #b1821f; }
    .btn-cream { background: var(--cream); color: var(--slate); }
    .btn-cream:hover { background: #e8ddc6; }
    .hero-image { position: relative; overflow: hidden; }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }

    .hero-stat-bar { background: var(--barn); display: flex; justify-content: center; }
    .stat { flex: 1; max-width: 260px; text-align: center; padding: 1.5rem 1rem; border-right: 1px solid rgba(255,255,255,0.2); }
    .stat:last-child { border-right: none; }
    .stat-number { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; color: white; line-height: 1; }
    .stat-label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.8); margin-top: 0.3rem; }

    section { padding: 5rem 2rem; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--barn); margin-bottom: 0.75rem; }
    .section-title { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 700; color: var(--slate); line-height: 1.2; margin-bottom: 1.25rem; }
    .section-body { font-size: 1.05rem; line-height: 1.8; color: #3d4f5c; max-width: 680px; }
    .section-body p + p { margin-top: 1rem; }

    .story { background: var(--white); }
    .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
